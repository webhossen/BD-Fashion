<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="CSS/styles.css">
    <link rel="stylesheet" href="CSS/Login.css">

    <title>Login | BD Fashion</title>
</head>

<body>

    <div class="login-wrapper">

        <div class="container" id="container">

            <!-- SIGN UP -->
            <div class="form-container sign-up">
                <form>
                    <h1>Create Account</h1>

                    <div class="social-icons">
                        <a class="icon"><i class="fab fa-google-plus-g"></i></a>
                        <a class="icon"><i class="fab fa-facebook-f"></i></a>
                        <a class="icon"><i class="fab fa-github"></i></a>
                        <a class="icon"><i class="fab fa-linkedin-in"></i></a>
                    </div>

                    <span>or use your email for registration</span>

                    <input type="text" placeholder="Name">
                    <input type="tel" placeholder="Phone">
                    <input type="email" placeholder="Email">
                    <input type="password" placeholder="Password">

                    <button>Sign Up</button>
                </form>
            </div>

            <!-- SIGN IN -->
            <div class="form-container sign-in">
                <form>
                    <h1>Sign In</h1>

                    <div class="social-icons">
                        <a class="icon"><i class="fab fa-google-plus-g"></i></a>
                        <a class="icon"><i class="fab fa-facebook-f"></i></a>
                        <a class="icon"><i class="fab fa-github"></i></a>
                        <a class="icon"><i class="fab fa-linkedin-in"></i></a>
                    </div>

                    <span>or use your email & password</span>

                    <input type="email" placeholder="Email">
                    <input type="password" placeholder="Password">

                    <a href="#">Forgot Password?</a>
                    <button>Sign In</button>
                </form>
            </div>

            <!-- ANIMATION PANEL -->
            <div class="toggle-container">
                <div class="toggle">

                    <div class="toggle-panel toggle-left">
                        <img src="Image/favicon-256.png" alt="BD Fashion Logo" class="toggle-logo">
                        <h1>Welcome Back!</h1>
                        <p>To keep connected, sign in using your details</p>
                        <button id="login">Sign In</button>
                    </div>

                    <div class="toggle-panel toggle-right">
                        <h1>Hello, Friend!</h1>
                        <img src="Image/favicon-256.png" alt="BD Fashion Logo" class="toggle-logo">
                        <p>Create your account to start your journey with us</p>
                        <button id="register">Sign Up</button>
                    </div>

                </div>
            </div>
        </div>

    </div>

    <!-- LOGIN SCRIPT -->
    <script src="js/login.js"></script>
    <script src="js/cart.js" defer></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            updateCartCount();
        });
    </script>

</body>

</html>
